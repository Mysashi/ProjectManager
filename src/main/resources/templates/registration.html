<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h2 { text-align: center; color: #1c1e21; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #4b4f56; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #1877f2; outline: none; box-shadow: 0 0 0 2px #e7f3ff; }
        button { width: 100%; padding: 12px; background-color: #42b72a; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 17px; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #36a420; }
        .links { text-align: center; margin-top: 20px; border-top: 1px solid #dddfe2; padding-top: 20px; }
        .links a { color: #1877f2; text-decoration: none; font-weight: 500; }
        .msg { text-align: center; margin-bottom: 15px; padding: 10px; border-radius: 4px; display: none; font-size: 14px; }
        .error { background-color: #ffebe9; color: #d93025; border: 1px solid rgba(217,48,37,0.2); }
        .success { background-color: #e6f4ea; color: #1e8e3e; border: 1px solid rgba(30,142,62,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h2>Создать аккаунт</h2>
    <div id="message" class="msg"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" placeholder="Введите логин" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль" required>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="links">
        Уже есть профиль? <a href="/auth/login">Войти</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const msgDiv = document.getElementById('message');

        try {
            // Замените на ваш актуальный эндпоинт (например, /api/v1/auth/register)
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                // Отправляем только те поля, которые теперь есть в форме
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                msgDiv.className = 'msg success';
    msgDiv.innerText = 'Регистрация прошла успешно! Переходим ко входу...';
    msgDiv.style.display = 'block';

    // Перенаправляем на нужный путь
    setTimeout(() => {
        window.location.href = '/auth/login';
    }, 1500);
            } else {
                const errorData = await response.json();
                msgDiv.className = 'msg error';
                msgDiv.innerText = errorData.message || 'Ошибка: возможно, логин уже занят';
                msgDiv.style.display = 'block';
            }
        } catch (error) {
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Не удалось связаться с сервером';
            msgDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
